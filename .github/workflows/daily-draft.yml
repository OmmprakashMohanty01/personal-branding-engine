name: Daily Brand Draft Automation

on:
  # Runs automatically at specific IST times depending on the day
  schedule:
    # MONDAY: 8:37 AM IST (03:07 UTC) - Contrarian
    - cron: '7 3 * * 1'
    
    # TUESDAY: 11:37 AM IST (06:07 UTC) - Technical
    - cron: '7 6 * * 2'
    
    # WEDNESDAY: 8:37 AM IST (03:07 UTC) - Story
    - cron: '7 3 * * 3'
    
    # THURSDAY: 11:37 AM IST (06:07 UTC) - Data/Statistic
    - cron: '7 6 * * 4'
    
    # FRIDAY: 8:37 AM IST (03:07 UTC) - Career/Prediction
    - cron: '7 3 * * 5'
    
    # SATURDAY: 10:37 AM IST (05:07 UTC) - Build in public
    - cron: '7 5 * * 6'
  workflow_dispatch:

# Ensures only one automation runs at a time, preventing duplicate LinkedIn posts
concurrency:
  group: daily-brand-draft
  cancel-in-progress: false

env:
  # Centralized URL so it is easy to change if you ever add a custom domain
  BASE_URL: https://personal-branding-engine.onrender.com

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    # Hard stop after 15 minutes to prevent infinite billing/hanging if APIs freeze
    timeout-minutes: 15

    steps:
      - name: Wake up Render Server
        run: |
          echo "Initiating wake-up sequence for $BASE_URL..."
          MAX_RETRIES=15
          WAIT_TIME=30
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            # --max-time 10 prevents curl from hanging indefinitely on a dropped connection
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/api/v1/health/deep" || echo "000")
            
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Server is fully awake and returned 200 OK!"
              break
            fi
            
            echo "⚠️ Server is sleeping/booting (Status: $STATUS). Retrying in $WAIT_TIME seconds... ($i/$MAX_RETRIES)"
            sleep $WAIT_TIME
            
            if [ "$i" -eq $MAX_RETRIES ]; then
              echo "❌ Error: Server failed to wake up after $((MAX_RETRIES * WAIT_TIME)) seconds."
              exit 1
            fi
          done

      - name: Trigger Daily Draft Automation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Server is awake. Triggering automation endpoint..."
          MAX_POST_RETRIES=3
          POST_WAIT_TIME=15
          RUN_ID="$(date +%Y-%m-%d)-automation-${GITHUB_RUN_ID}"
          
          for ((i=1; i<=MAX_POST_RETRIES; i++)); do
            echo "Attempt $i/$MAX_POST_RETRIES (Run ID: $RUN_ID)..."
            
            # --fail-with-body: Forces curl to return an error exit code for 4xx/5xx but still prints the body
            # --connect-timeout 10: Fails quickly if Render drops the connection
            # --max-time 120: Gives Pollinations/LinkedIn 2 full minutes to process before giving up
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
                 --fail-with-body \
                 --connect-timeout 10 \
                 --max-time 120 \
                 -X POST "$BASE_URL/api/v1/automation/daily" \
                 -H "X-Cron-Secret: $CRON_SECRET" \
                 -H "X-Run-ID: $RUN_ID" \
                 -H "Content-Type: application/json" \
                 -d '{}' || echo "000")
            
            echo "HTTP Status: $HTTP_STATUS"
            echo "Response Body:"
            cat response.json
            echo "" # Adds a newline for readable logs
            
            # Check if the HTTP status is successful
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
              
              if command -v jq >/dev/null 2>&1; then
                STATUS_VAL=$(jq -r '.status' response.json)
                POST_ID=$(jq -r '.linkedin_post_id' response.json)
                CHAR_COUNT=$(jq -r '.character_count' response.json)
                
                if [ "$STATUS_VAL" != "PUBLISHED" ] && [ "$STATUS_VAL" != "draft_created" ]; then
                   echo "❌ Error: Backend returned 200 OK, but status is '$STATUS_VAL' (Expected PUBLISHED or draft_created)."
                   exit 1
                fi
                
                if [ "$STATUS_VAL" == "PUBLISHED" ] && [ "$POST_ID" == "null" ]; then
                   echo "❌ Error: Post status is PUBLISHED but no linkedin_post_id is present in response."
                   exit 1
                fi
                
                if [ "$CHAR_COUNT" -eq 0 ] || [ "$CHAR_COUNT" == "null" ]; then
                   echo "❌ Error: character_count is invalid or missing in response."
                   exit 1
                fi
                
                echo "✅ Daily automation completed successfully. Status: $STATUS_VAL, Chars: $CHAR_COUNT"
                exit 0
              else
                 echo "⚠️ jq not found, falling back to simple success check."
                 echo "✅ Daily automation completed successfully."
                 exit 0
              fi
            elif [ "$HTTP_STATUS" -eq 429 ]; then
              echo "✅ HTTP 429 received (Another process is holding the lock). Exiting successfully."
              exit 0
            fi
            
            if [ "$i" -eq $MAX_POST_RETRIES ]; then
              echo "❌ Error: Automation failed after $MAX_POST_RETRIES attempts."
              exit 1
            fi
            
            echo "⚠️ Request failed or timed out. Retrying in $POST_WAIT_TIME seconds..."
            sleep $POST_WAIT_TIME
          done
