name: Daily Brand Draft Automation

on:
  # Runs at 04:00 UTC every day (9:30 AM IST)
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Ensures only one automation runs at a time, preventing duplicate LinkedIn posts
concurrency:
  group: daily-brand-draft
  cancel-in-progress: false

env:
  # Centralized URL so it is easy to change if you ever add a custom domain
  BASE_URL: https://personal-branding-engine.onrender.com

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    # Hard stop after 15 minutes to prevent infinite billing/hanging if APIs freeze
    timeout-minutes: 15

    steps:
      - name: Trigger Daily Post (with Render Cold Start Buffer)
        run: |
          curl -f -X POST "https://personal-branding-engine.onrender.com/api/v1/automation/daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --retry 5 \
            --retry-delay 15 \
            --retry-max-time 400
